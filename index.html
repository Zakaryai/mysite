<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zakarya Site</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      width:90%;
      max-width:400px;
      box-shadow:0 0 25px rgba(0,0,0,0.5);
    }

    h1{
      color:#38bdf8;
      font-size:32px;
    }

    p{
      color:#cbd5e1;
      margin-top:10px;
    }

    button{
      margin-top:20px;
      padding:12px 25px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      color:black;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>مرحبا 🌍</h1>
    <p>أول موقع ديالي مستضاف على Render</p>

    <button onclick="showMsg()">
      اضغط هنا
    </button>
  </div>

  <script>
    function showMsg(){
      alert("خدم الموقع بنجاح 🚀");
    }
  </script>

</body>
</html>

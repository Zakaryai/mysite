<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقعي الاحترافي</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.box{
    width:320px;
    background:#1e293b;
    padding:30px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    animation:fade 1s ease;
}

img{
    width:120px;
    border-radius:50%;
    margin-bottom:15px;
}

h1{
    color:#38bdf8;
    font-size:38px;
    margin:10px 0;
}

p{
    color:white;
    font-size:18px;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#38bdf8;
    color:black;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:white;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="box">

<img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1>🚀 مرحبا</h1>

<p>
موقع احترافي معمول بـ GitHub Pages
</p>

<button onclick="goGoogle()">
Google
</button>

<button onclick="goYoutube()">
YouTube
</button>

<button onclick="goFacebook()">
Facebook
</button>

<button onclick="showMsg()">
Message
</button>

</div>

<script>

function goGoogle(){
window.location.href="https://google.com";
}

function goYoutube(){
window.location.href="https://youtube.com/@7m7";
}

function goFacebook(){
window.location.href="https://facebook.com";
}

function showMsg(){
alert("🔥 الموقع خدام بنجاح");
}

</script>
}

</script>

</body>
</html>

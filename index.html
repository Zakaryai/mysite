<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>موقعي الاحترافي</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:white;
}

.card{
width:100%;
max-width:380px;
background:#1e293b;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #38bdf8;
margin-bottom:20px;
object-fit:cover;
}

h1{
font-size:32px;
margin-bottom:10px;
color:#38bdf8;
}

p{
margin-bottom:25px;
color:#cbd5e1;
line-height:1.7;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

.google{
background:#ffffff;
color:black;
}

.youtube{
background:#ff0000;
color:white;
}

.facebook{
background:#1877f2;
color:white;
}

.telegram{
background:#229ED9;
color:white;
}

.message{
background:#38bdf8;
color:black;
}

.footer{
margin-top:20px;
font-size:14px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="card">

<img class="avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1>🚀 مرحبا</h1>

<p>
موقع احترافي معمول بـ HTML CSS JavaScript  
يمكنك إضافة روابطك الخاصة بسهولة
</p>

<button class="google" onclick="goGoogle()">
Google
</button>

<button class="youtube" onclick="goYoutube()">
YouTube
</button>

<button class="facebook" onclick="goFacebook()">
Facebook
</button>

<button class="telegram" onclick="goTelegram()">
Telegram
</button>

<button class="message" onclick="showMsg()">
Message
</button>

<div class="footer">
© 2026 My Professional Website
</div>

</div>

<script>

function goGoogle(){
window.location.href="https://google.com";
}

function goYoutube(){
window.location.href="https://youtube.com/@7m7-c2";
}

function goFacebook(){
window.location.href="https://facebook.com";
}

function goTelegram(){
window.location.href="https://t.me/";
}

function showMsg(){
alert("🔥 الموقع خدام بشكل احترافي");
}

</script>

</body>
    </html>

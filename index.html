<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Link Hub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#020617;
overflow:hidden;
color:white;
}

body::before{
content:"";
position:absolute;
width:500px;
height:500px;
background:#00f0ff;
filter:blur(180px);
opacity:.15;
top:-120px;
right:-120px;
}

body::after{
content:"";
position:absolute;
width:400px;
height:400px;
background:#7c3aed;
filter:blur(180px);
opacity:.15;
bottom:-100px;
left:-100px;
}

.card{
position:relative;
z-index:2;
width:92%;
max-width:420px;
background:rgba(15,23,42,.7);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:30px;
padding:35px 25px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,.5);
animation:fade 1s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #00e5ff;
box-shadow:0 0 25px #00e5ff;
margin-bottom:18px;
}

h1{
font-size:34px;
font-weight:900;
margin-bottom:8px;
background:linear-gradient(90deg,#38bdf8,#a855f7);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.bio{
color:#cbd5e1;
font-size:15px;
line-height:1.8;
margin-bottom:28px;
}

.btn{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:18px;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.25s;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.btn:hover{
transform:translateY(-3px) scale(1.02);
}

.youtube{
background:#ff0000;
color:white;
box-shadow:0 0 20px rgba(255,0,0,.35);
}

.github{
background:#111827;
color:white;
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.telegram{
background:#229ED9;
color:white;
box-shadow:0 0 20px rgba(34,158,217,.35);
}

.discord{
background:#5865F2;
color:white;
box-shadow:0 0 20px rgba(88,101,242,.35);
}

.message{
background:#22c55e;
color:black;
}

.stats{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:22px;
}

.box{
flex:1;
background:rgba(255,255,255,.05);
padding:14px;
border-radius:16px;
}

.box h2{
font-size:20px;
color:#38bdf8;
}

.box span{
font-size:13px;
color:#94a3b8;
}

.footer{
margin-top:24px;
font-size:13px;
color:#64748b;
}

</style>
</head>

<body>

<div class="card">

<img class="avatar" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1>⚡ Alpha</h1>

<p class="bio">
موقع شخصي احترافي بروابط السوشيال ميديا
بتصميم عصري وتأثيرات احترافية.
</p>

<button class="btn youtube" onclick="goYoutube()">
▶ YouTube
</button>

<button class="btn github" onclick="goGithub()">
💻 GitHub
</button>

<button class="btn telegram" onclick="goTelegram()">
✈ Telegram
</button>

<button class="btn discord" onclick="goDiscord()">
🎮 Discord
</button>

<button class="btn message" onclick="showMsg()">
🔥 Message
</button>

<div class="stats">
<div class="box">
<h2>26K</h2>
<span>Followers</span>
</div>

<div class="box">
<h2>120+</h2>
<span>Projects</span>
</div>

<div class="box">
<h2>5★</h2>
<span>Rating</span>
</div>
</div>

<div class="footer">
© 2026 Alpha Professional Page
</div>

</div>

<script>

function goYoutube(){
window.location.href="https://youtube.com/@7m7-c2";
}

function goGithub(){
window.location.href="https://github.com";
}

function goTelegram(){
window.location.href="https://t.me";
}

function goDiscord(){
window.location.href="https://discord.com";
}

function showMsg(){
alert("🔥 Welcome To Alpha Website");
}

</script>

</body>
    </html>

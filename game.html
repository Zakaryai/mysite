<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لعبة القفز</title>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.game{
width:350px;
height:500px;
background:#1e293b;
border-radius:20px;
position:relative;
overflow:hidden;
box-shadow:0 0 30px #000;
}

.player{
width:50px;
height:50px;
background:#38bdf8;
border-radius:10px;
position:absolute;
bottom:20px;
left:30px;
transition:0.1s;
}

.enemy{
width:40px;
height:40px;
background:red;
border-radius:10px;
position:absolute;
bottom:20px;
right:-50px;
animation:move 2s linear infinite;
}

@keyframes move{
0%{
right:-50px;
}
100%{
right:400px;
}
}

.jump{
animation:jump 0.7s;
}

@keyframes jump{
0%{bottom:20px;}
50%{bottom:170px;}
100%{bottom:20px;}
}

h1{
position:absolute;
top:10px;
width:100%;
text-align:center;
font-size:28px;
}

.score{
position:absolute;
top:60px;
width:100%;
text-align:center;
font-size:22px;
}

.gameover{
position:absolute;
top:200px;
width:100%;
text-align:center;
font-size:35px;
display:none;
color:red;
}

button{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:15px 30px;
border:none;
border-radius:12px;
background:#38bdf8;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="game">

<h1>🎮 لعبة القفز</h1>

<div class="score" id="score">
النقاط: 0
</div>

<div class="player" id="player"></div>

<div class="enemy" id="enemy"></div>

<div class="gameover" id="gameover">
💀 خسرت
</div>

<button onclick="jump()">
قفز
</button>

</div>

<!DOCTYPE html>
<html lang="ar">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
padding-top:50px;
}

.box{
background:#1e293b;
width:300px;
margin:auto;
padding:30px;
border-radius:20px;
box-shadow:0 0 30px #000;
}

button{
margin-top:20px;
padding:15px 25px;
border:none;
border-radius:15px;
background:#38bdf8;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

#score{
font-size:40px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="box">

<h1>🎮 لعبة الضغط</h1>

<p>
كل ضغطة تزيد نقطة
</p>

<div id="score">
0
</div>

<button onclick="add()">
اضغط
</button>

</div>

<script>

let score = 0;

function add(){

score++;

document.getElementById("score").innerHTML = score;

}

</script>

</body>
</html>
